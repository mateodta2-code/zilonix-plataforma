name: CI

on:
  pull_request:
    branches: [main, produccion]
  push:
    branches: [main, produccion]

jobs:
  # Issue #43 (Z-P0-04b) — job aparte de build-and-test a propósito:
  # un secreto filtrado es un problema de seguridad del repositorio
  # completo (historial incluido), no algo que dependa de que el
  # build compile o las pruebas pasen. fetch-depth: 0 trae todo el
  # historial (gitleaks escanea commit por commit, no solo el último).
  #
  # Binario oficial en vez de gitleaks/gitleaks-action@v2: esa acción
  # exige GITLEAKS_LICENSE para repos privados de una organización —
  # no vale la pena ese riesgo (y la demora de confirmarlo) cuando el
  # binario hace exactamente lo mismo, verificado en local con el
  # mismo comando antes de este PR.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - run: gitleaks detect --redact --config .gitleaks.toml

  build-and-test:
    runs-on: ubuntu-latest
    # Tarea 1.4: la prueba de aislamiento (db/rls.test.ts) necesita un
    # Postgres de verdad con RLS activa — no se puede probar con un
    # mock, la protección vive en la base misma. Este Postgres es
    # efímero (vive solo durante esta corrida de CI) y vacío, así que
    # usar una contraseña fija acá adentro no es un secreto real.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci
          POSTGRES_DB: railway
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres_ci@localhost:5432/railway
      DATABASE_URL_APP: postgresql://app_user:app_user_ci@localhost:5432/railway
      # Tarea 1.11: segundo usuario de base, aparte, solo lectura de lo
      # agregado — mismo criterio que arriba, contraseña fija solo
      # porque este Postgres muere al terminar la corrida.
      DATABASE_URL_SUPERADMIN: postgresql://superadmin_user:superadmin_user_ci@localhost:5432/railway
      # Tarea 2.4: tercer usuario de base, solo para avisos_ml — mismo
      # criterio, contraseña fija solo porque este Postgres es efímero.
      DATABASE_URL_TRABAJADOR: postgresql://trabajador_user:trabajador_user_ci@localhost:5432/railway
      # Tarea 2.3: clave de prueba para que las pruebas de cifrado de
      # tokens de Mercado Libre corran en CI — nunca la clave real.
      ML_TOKEN_KEY_V1: "DJLURtqf9klRrWnnPtWUqOgDqgqJ/K8aqMdatfdtzhk="
      # Tarea 1.5: llaves de Clerk ficticias, solo para que el build
      # compile en CI — no son cuentas reales, no sirven para nada fuera
      # de esta corrida. Las reales viven en Railway.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_ZmFrZS1jaS1rZXkuY2xlcmsuYWNjb3VudHMuZGV2JA"
      CLERK_SECRET_KEY: "sk_test_fakecikeyfakecikeyfakecikeyfakecikey00"
      # Fix middleware (2026-10-21): fichas ficticias para que las
      # pruebas nuevas del webhook y del trabajador corran en CI — no
      # son credenciales reales, no sirven para nada fuera de esta
      # corrida. Las reales viven en Railway.
      ML_CLIENT_ID: "ml-client-id-fake-ci"
      TRABAJADOR_SECRET: "trabajador-secret-fake-ci-0123456789"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run typecheck
      - name: Aplicar migraciones (db/migrations/)
        run: npm run db:migrate
      - name: Activar seguridad por fila (RLS) — contraseñas de prueba solo para este Postgres efímero
        run: |
          sed -e 's/PONE_ACA_UNA_CONTRASEÑA_REAL/app_user_ci/' -e 's/PONE_ACA_OTRA_CONTRASEÑA_REAL/superadmin_user_ci/' -e 's/PONE_ACA_UNA_TERCERA_CONTRASEÑA_REAL/trabajador_user_ci/' db/rls-setup.sql > /tmp/rls-ci.sql
          PGPASSWORD=postgres_ci psql -h localhost -U postgres -d railway -f /tmp/rls-ci.sql
      - name: Verificar colisiones en el historial de migraciones (issue #36, Z-P0-08 S2)
        run: npx drizzle-kit check
      - run: npm test
      - run: npm run build
