name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Variables ficticias solo para que el build compile (no se
          # conecta a nada real en CI) — las reales viven en Railway.
          # Tarea 1.3: DATABASE_URL_APP es la que usa db/index.ts de
          # verdad; DATABASE_URL queda solo para db/migrate.ts.
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          DATABASE_URL_APP: "postgresql://ci:ci@localhost:5432/ci"
