name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Tarea 1.4: la prueba de aislamiento (db/rls.test.ts) necesita un
    # Postgres de verdad con RLS activa — no se puede probar con un
    # mock, la protección vive en la base misma. Este Postgres es
    # efímero (vive solo durante esta corrida de CI) y vacío, así que
    # usar una contraseña fija acá adentro no es un secreto real.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci
          POSTGRES_DB: railway
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres_ci@localhost:5432/railway
      DATABASE_URL_APP: postgresql://app_user:app_user_ci@localhost:5432/railway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run typecheck
      - name: Aplicar migraciones (db/migrations/)
        run: npm run db:migrate
      - name: Activar seguridad por fila (RLS) — contraseña de prueba solo para este Postgres efímero
        run: |
          sed 's/PONE_ACA_UNA_CONTRASEÑA_REAL/app_user_ci/' db/rls-setup.sql > /tmp/rls-ci.sql
          PGPASSWORD=postgres_ci psql -h localhost -U postgres -d railway -f /tmp/rls-ci.sql
      - run: npm test
      - run: npm run build
