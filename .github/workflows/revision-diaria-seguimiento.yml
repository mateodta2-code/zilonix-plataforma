name: Revisión diaria de seguimientos de Mercado Libre (staging)

# Issue #175 — apunta a STAGING a propósito, mismo criterio que
# .github/workflows/trabajador-avisos-ml.yml: todavía no hay ninguna
# cuenta real conectada en producción. Antes de conectar cuentas reales
# en producción, agregar un workflow gemelo apuntando al dominio de
# producción real (ver docs/cron-seguimiento.md para las alternativas
# de dónde programar este cron, incluida esta misma, una vez que
# corresponda moverlo).
#
# La ruta procesa UN lote por llamada (hasta 50 seguimientos — ver
# TAMAÑO_LOTE en lib/trabajos/revisionDiariaSeguimiento.ts), nunca
# todos de una sola corrida. Por eso este workflow corre cada hora de
# 08:00 a 13:00 UTC (6 corridas — 03:00 a 08:00 en Colombia, UTC-5),
# no una sola vez: una empresa con más de 50 seguimientos activos
# necesita varias corridas para que el lote llegue a todos (el orden
# ASC NULLS FIRST por ultima_revision_ts asegura que cada corrida
# atienda a los que quedaron pendientes de la anterior, nunca repite
# siempre los mismos primeros 50).
on:
  schedule:
    - cron: "0 8-13 * * *"
  workflow_dispatch: {}

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Revisar un lote de seguimientos pendientes
        run: |
          curl -sf -X POST "https://web-staging-d979.up.railway.app/api/trabajos/seguimiento" \
            -H "x-seguimiento-trabajador-secret: ${{ secrets.SEGUIMIENTO_TRABAJADOR_SECRET_STAGING }}" \
            --max-time 300
